<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tótem central 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#EDE9E1;color:#2A2E37;font-family:'Instrument Sans',sans-serif}
  a{color:#2A2E37}a:hover{color:#C8702A}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  .cap{position:fixed;top:24px;left:28px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  .cap h1{margin:0;font:800 34px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
  .cap p{margin:0;font-size:14px;color:#4A4F5A}
  .ctl{position:fixed;top:24px;right:28px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:60vw}
  .ctl button{font:600 13px 'Instrument Sans',sans-serif;border:0;border-radius:999px;padding:9px 14px;background:#fff;color:#2A2E37;cursor:pointer}
  .ctl button[aria-pressed="true"]{background:#F6A15B}
</style>
</head>
<body>
<three-d-stage name="totem-central" background="#EDE9E1" autorotate></three-d-stage>
<div class="cap"><h1>Tótem central</h1><p>Paradero multi-ruta · 45 cm · una carita por ruta</p></div>
<div class="ctl" id="ctl"></div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const K = '#2A2E37';
const mat = (name, color, o = {}) => new THREE.MeshStandardMaterial({ name, color, roughness: 0.5, metalness: 0, ...o });
const M = { carbon: mat('carbon', K, { roughness: 0.4, metalness: 0.1 }), blanco: mat('ojo-blanco', '#FFFFFF', { roughness: 0.25 }), boca: mat('boca-interior', '#7A2E2A') };
let RUTAS = [['51','#4F7FD8','¡ya!'], ['C4','#5FB36B','8′'], ['38','#E36F8C','15′'], ['T1','#2FA6A0','22′']];
if (document.fonts) await document.fonts.load('800 80px "Bricolage Grotesque"').catch(() => {});

function rbox(w, h, d, r, n = 12) {
  const g = new THREE.BoxGeometry(1, 1, 1, n, n, n), p = g.attributes.position, v = new THREE.Vector3(), o = new THREE.Vector3();
  const hw = w/2 - r, hh = h/2 - r, hd = d/2 - r;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).multiply(new THREE.Vector3(w, h, d));
    const ix = Math.max(-hw, Math.min(hw, v.x)), iy = Math.max(-hh, Math.min(hh, v.y)), iz = Math.max(-hd, Math.min(hd, v.z));
    o.set(v.x - ix, v.y - iy, v.z - iz); if (o.lengthSq() > 0) o.normalize().multiplyScalar(r); p.setXYZ(i, ix + o.x, iy + o.y, iz + o.z); }
  g.computeVertexNormals(); return g;
}
const add = (par, g, m, name, x = 0, y = 0, z = 0) => { const k = new THREE.Mesh(g, m); k.name = name; k.position.set(x, y, z); k.castShadow = true; par.add(k); return k; };
function textTex(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return { cv, t }; }

const T = new THREE.Group(); T.name = 'Totem-central';
add(T, new THREE.CylinderGeometry(0.06, 0.066, 0.016, 48), M.carbon, 'base', 0, 0.008, 0);
const BW = 0.13, BH = 0.25, BD = 0.07, BY = 0.016 + BH / 2;
add(T, rbox(BW, BH, BD, 0.022), M.carbon, 'cuerpo', 0, BY, 0);
const FZ = BD / 2;

function cara(par, w, h, r, color, grande, label) {
  const g = new THREE.Group(); g.name = label; par.add(g);
  const m = mat('ruta-' + label, color);
  const pd = grande ? 0.04 : 0.028; add(g, rbox(w, h, pd, Math.min(r, pd / 2 - 0.001)), m, 'panel', 0, 0, -pd / 2 + 0.007);
  const er = grande ? 0.015 : 0.0095, ex = grande ? [-0.058, -0.026] : [-0.036, -0.013];
  const ojos = ex.map((x, i) => { const eg = new THREE.Group(); eg.name = 'ojo-' + i; eg.position.set(x, grande ? 0.006 : 0, 0.009); g.add(eg);
    const w_ = add(eg, new THREE.SphereGeometry(er, 32, 24), M.blanco, 'ojo-blanco'); w_.scale.z = 0.5;
    const pu = add(eg, new THREE.SphereGeometry(er * 0.52, 28, 20), M.carbon, 'pupila', 0, grande ? er * 0.38 : 0, er * 0.42); pu.scale.z = 0.5;
    add(eg, new THREE.SphereGeometry(er * 0.13, 14, 10), M.blanco, 'brillo', er * 0.2, (grande ? er * 0.38 : 0) + er * 0.18, er * 0.6); return eg; });
  const tw = grande ? 0.088 : 0.05, th = grande ? 0.04 : 0.03;
  const { cv, t } = textTex(grande ? 640 : 320, grande ? 290 : 190);
  const tm = mat('texto-' + label, '#FFFFFF', { map: t, transparent: true });
  const pl = add(g, new THREE.PlaneGeometry(tw, th), tm, 'texto', grande ? 0.036 : 0.026, 0, 0.0075);
  let boca = null;
  if (grande) { boca = new THREE.Group(); boca.name = 'boca'; boca.position.set(-0.042, -0.022, 0.007); g.add(boca);
    const bo = add(boca, new THREE.SphereGeometry(0.0085, 28, 20), M.carbon, 'boca-contorno'); bo.scale.set(1, 1.25, 0.45);
    const bi = add(boca, new THREE.SphereGeometry(0.0055, 24, 16), M.boca, 'lengua', 0, -0.0035, 0.002); bi.scale.set(1, 0.6, 0.4); }
  return { g, m, ojos, cv, t, boca, grande };
}
const top = cara(T, 0.2, 0.085, 0.026, RUTAS[0][1], true, 'llega');
top.g.position.set(0, 0.016 + BH + 0.03, 0.006);
const manos = [-1, 1].map(sx => { const k = add(T, new THREE.SphereGeometry(0.017, 32, 24), top.m, 'mano', sx * 0.122, top.g.position.y - 0.005, 0.02); k.scale.set(0.9, 1, 0.9); return k; });
const paneles = [0.205, 0.14, 0.075].map((y, i) => { const c = cara(T, 0.106, 0.05, 0.015, '#fff', false, 'ruta-' + (i + 1)); c.g.position.set(0, y, FZ + 0.002); return c; });

function escribir(c, num, txt) {
  const x = c.cv.getContext('2d'); x.clearRect(0, 0, c.cv.width, c.cv.height); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (c.grande) { x.font = '800 118px "Bricolage Grotesque", sans-serif'; x.fillText(num, 150, 150); x.globalAlpha = .5; x.fillRect(300, 70, 8, 160); x.globalAlpha = 1; x.font = '800 100px "Bricolage Grotesque", sans-serif'; x.fillText(txt, 470, 152); }
  else { x.font = '800 110px "Bricolage Grotesque", sans-serif'; x.fillText(txt, 160, 100); }
  c.t.needsUpdate = true;
}
function aplicar() {
  top.m.color.set(RUTAS[0][1]); escribir(top, RUTAS[0][0], '¡ya!');
  paneles.forEach((p, i) => { p.m.color.set(RUTAS[i + 1][1]); escribir(p, RUTAS[i + 1][0], RUTAS[i + 1][2]); });
}
aplicar();
stage.setObject(T);

const ctl = document.getElementById('ctl');
const mk = (label, on, fn) => { const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-pressed', on); b.onclick = () => fn(b); ctl.append(b); return b; };
let anim = true, pop = 1;
mk('llega la siguiente', false, () => { const mins = RUTAS.slice(1).map(r => r[2]); const nx = RUTAS.slice(1); nx.push([RUTAS[0][0], RUTAS[0][1], '25′']); RUTAS = nx.map((r, i) => i === 0 ? [r[0], r[1], '¡ya!'] : [r[0], r[1], i < mins.length ? mins[i] : '25′']); pop = 0; aplicar(); });
mk('animación', true, b => { anim = !anim; b.setAttribute('aria-pressed', anim); });

const t0 = performance.now(); let last = t0;
(function tick() {
  requestAnimationFrame(tick);
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
  pop += (1 - pop) * Math.min(1, dt * 6);
  const s = 0.6 + 0.4 * pop + (anim ? Math.abs(Math.sin(t * 5)) * 0.03 : 0);
  top.g.scale.set(s, s, s);
  const blink = (o) => { if (!anim) return 1; const b = (t + o) % 3.8; return b > 3.55 ? Math.max(0.08, Math.abs(Math.cos((b - 3.55) / 0.25 * Math.PI))) : 1; };
  top.ojos.forEach(e => e.scale.y = blink(0) * 1.08);
  paneles.forEach((p, i) => p.ojos.forEach(e => e.scale.y = blink(0.9 * (i + 1))));
  if (top.boca) top.boca.scale.y = anim ? 0.55 + 0.45 * Math.abs(Math.cos((t % 1.4) / 1.4 * Math.PI * 2)) : 1;
  const fl = anim ? Math.sin(t * 1.8) * 0.004 : 0; manos[0].position.y = top.g.position.y - 0.005 + fl; manos[1].position.y = top.g.position.y - 0.005 - fl;
})();
</script>
</body>
</html>
