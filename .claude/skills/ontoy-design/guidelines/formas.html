<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-page);font:var(--text-body);color:var(--text)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:88px;display:flex;flex-direction:column;gap:5px;font:var(--text-caption)}.sw i{display:block;height:56px;border-radius:14px;box-shadow:var(--ring)}.sw small{font:500 11px var(--font-body);color:var(--text-3)}</style></head><body><div class="row" style="align-items:flex-end"><div class="sw"><i style="background:var(--surface);border-radius:var(--r-plate);height:64px"></i>7px</div><div class="sw"><i style="background:var(--surface);border-radius:var(--r-btn);height:64px"></i>12px</div><div class="sw"><i style="background:var(--surface);border-radius:var(--r-card-sm);height:64px"></i>22px</div><div class="sw"><i style="background:var(--surface);border-radius:var(--r-card);height:64px"></i>26px</div><div class="sw"><i style="background:var(--surface);border-radius:var(--r-phone);height:64px"></i>44px</div><div class="sw"><i style="background:var(--surface);border-radius:var(--r-pill);height:64px"></i>pill</div></div></body></html>
