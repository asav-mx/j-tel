name: Vigilante de salud

# Corre en GitHub, fuera de Vercel y fuera de Neon. Esa independencia es todo el
# punto: el 2026-07-28 una rotación de contraseña dejó los crones sin acceso
# durante 13 horas y nadie se enteró, porque el heartbeat que vigilaba era
# también un cron de Vercel y cayó con lo demás.
#
# LA REGLA QUE ESTE ARCHIVO APRENDIÓ POR LAS MALAS, Y SON DOS GENERACIONES:
# un instrumento no está probado hasta que se comprueba que su AVISO LLEGA a un
# humano. Detectar y avisar son dos cosas, y la segunda casi nunca se prueba.
#   · 1ª generación — el heartbeat vivía dentro de Vercel y cayó con lo que
#     vigilaba: 13 horas sin que nadie se enterara.
#   · 2ª generación — este vigilante, fuera de Vercel: detectaba el 503 y NO
#     podía avisar. `gh` sin repositorio y la etiqueta `salud` inexistente.
#     117 corridas, cero avisos, NUEVE DÍAS mudo.
# Por eso existe `simular_codigo`: se provoca un aviso a propósito y se
# comprueba que llega, antes de darlo por bueno.
#
# Requisito único: la variable de repositorio SALUD_URL con la URL pública de
# /api/salud (Settings -> Secrets and variables -> Actions -> Variables).
# Si además defines el secreto SALUD_TOKEN, se manda como Bearer.

on:
  schedule:
    # Cada 15 min. GitHub puede retrasarlo bajo carga; no importa, el fallo que
    # buscamos dura horas, no minutos.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simular_codigo:
        description: >-
          Forzar un código en vez de sondear, para COMPROBAR QUE EL AVISO LLEGA.
          Vacío = sondeo real. Ej: 503 abre el aviso; 200 lo cierra.
        required: false
        default: ""

permissions:
  issues: write

concurrency:
  group: vigilante-salud
  cancel-in-progress: false

jobs:
  sondear:
    runs-on: ubuntu-latest
    # `gh` deduce el repositorio del git local, y aquí NO hay checkout: sin esto
    # toda llamada a `gh` muere con «fatal: not a git repository». Ese fue el
    # defecto que dejó este vigilante MUDO nueve días: detectaba el 503, fallaba
    # al abrir el aviso, y lo único que quedaba era una corrida roja que nadie
    # mira. Detectar y avisar son dos cosas distintas.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Comprobar que SALUD_URL está configurada
        if: vars.SALUD_URL == ''
        run: |
          echo "::error::Falta la variable de repositorio SALUD_URL."
          exit 1

      - name: Sondear /api/salud
        id: sondeo
        run: |
          # Provocación deliberada: la única forma de comprobar que el aviso
          # LLEGA sin esperar a que producción se caiga. Un instrumento no está
          # probado hasta que su aviso se vio llegar.
          if [ -n "$SIMULAR" ]; then
            echo "::notice::SIMULACRO: se fuerza el código $SIMULAR sin sondear."
            echo "codigo=$SIMULAR" >> "$GITHUB_OUTPUT"
            {
              echo 'cuerpo<<FIN'
              echo "{\"simulacro\": true, \"codigo_forzado\": \"$SIMULAR\"}"
              echo 'FIN'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          RESP=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            ${SALUD_TOKEN:+-H "Authorization: Bearer $SALUD_TOKEN"} \
            "$SALUD_URL")
          CURL_RC=$?
          set -e

          if [ $CURL_RC -ne 0 ]; then
            # Ni siquiera respondió: para el caso que nos importa eso es
            # exactamente igual de grave que un 503.
            echo "codigo=000" >> "$GITHUB_OUTPUT"
            {
              echo 'cuerpo<<FIN'
              echo "No hubo respuesta de $SALUD_URL (curl salió con $CURL_RC)."
              echo 'FIN'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODIGO=$(echo "$RESP" | tail -n1)
          CUERPO=$(echo "$RESP" | sed '$d')
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          {
            echo 'cuerpo<<FIN'
            echo "$CUERPO"
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"
        env:
          SALUD_URL: ${{ vars.SALUD_URL }}
          SALUD_TOKEN: ${{ secrets.SALUD_TOKEN }}
          SIMULAR: ${{ inputs.simular_codigo }}

      - name: Abrir o actualizar el aviso
        if: steps.sondeo.outputs.codigo != '200'
        env:
          GH_TOKEN: ${{ github.token }}
          CODIGO: ${{ steps.sondeo.outputs.codigo }}
          CUERPO: ${{ steps.sondeo.outputs.cuerpo }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Segundo defecto que mantenía esto mudo: la etiqueta `salud` NO
          # existía en el repositorio, así que `gh issue create --label salud`
          # habría fallado igual aunque `gh` sí supiera el repo. Se crea aquí
          # —idempotente— en vez de depender de que alguien la haya creado a
          # mano: una precondición que el propio guion garantiza no se puede
          # saltar.
          gh label create salud \
            --color B60205 \
            --description "Vigilante de salud: la ingesta o la verificación están en riesgo" \
            2>/dev/null || true

          TITULO="Ingesta en riesgo — /api/salud responde $CODIGO"
          EXISTENTE=$(gh issue list --label salud --state open --limit 1 --json number --jq '.[0].number // empty')

          MENSAJE=$(printf '**%s** · el sondeo respondió \`%s\`.\n\n```json\n%s\n```\n\n[Ver la corrida](%s)' \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$CODIGO" "$CUERPO" "$CORRIDA")

          if [ -n "$EXISTENTE" ]; then
            # Un solo issue por incidente: comentar, no inundar de duplicados.
            gh issue comment "$EXISTENTE" --body "$MENSAJE"
          else
            gh issue create --title "$TITULO" --label salud --body "$MENSAJE"
          fi

      - name: Cerrar el aviso si volvió la salud
        if: steps.sondeo.outputs.codigo == '200'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTENTE=$(gh issue list --label salud --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            # Avisar del cierre es tan importante como avisar de la caída: sin
            # el aviso de "ya volvió", uno aprende a ignorar el canal.
            gh issue close "$EXISTENTE" --comment "Salud restablecida el $(date -u '+%Y-%m-%d %H:%M:%S UTC'). [Ver la corrida]($CORRIDA)"
          fi

      - name: Fallar la corrida si está enfermo
        if: steps.sondeo.outputs.codigo != '200'
        run: |
          echo "::error::/api/salud respondió ${{ steps.sondeo.outputs.codigo }}"
          exit 1
