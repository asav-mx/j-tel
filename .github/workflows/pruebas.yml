name: Pruebas

# La puerta. Hasta ahora el único workflow del repo sondeaba producción cada 15
# minutos: nada corría en un pull request. La compilación de Vercel era la única
# señal, y una compilación verde no dice nada sobre si las pruebas pasan.
#
# Lo que costó no tenerla: `sesion-actual.test.ts` llevaba días roja en `main`
# —y dos de sus pruebas pasaban sin ejercer nada— sin que nadie se enterara.
# Una prueba verde que nadie ejecuta no protege nada.
#
# Las pruebas de integración NO corren aquí: escriben, y escriben contra una
# rama desechable de Neon que exige `DATABASE_URL_TEST`. Se corren a mano con
# `pnpm --filter @jtel/db test:integration`. Que no corran se dice en voz alta
# al final del job en vez de dejar que un verde parezca cobertura completa.

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior: lo que importa es
# el último commit, y dejar corridas viejas compitiendo confunde cuál verde es
# el que cuenta.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La valla del diff necesita historia: con el checkout superficial no
          # existe `origin/main..HEAD` y la comprobación no puede correr.
          fetch-depth: 0

      # Va ANTES de compilar, y a propósito: comprueba que el PR todavía lleva
      # lo que sus commits cambiaron. Compilar en verde sobre un árbol al que un
      # merge le quitó el cambio no prueba nada — el #302 se mergeó así, con una
      # descripción prometiendo código que no llevaba. Ver el guion.
      - name: El PR lleva lo que cambió
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          RAMA_BASE="origin/${{ github.base_ref }}" node scripts/verificar-diff-completo.mjs
        env:
          DIFF_COMPLETO_ESPERADO: ${{ vars.DIFF_COMPLETO_ESPERADO }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # Antes de compilar, y a propósito: `next/font/google` descarga las
      # fuentes DURANTE `next build`, y si Google no contesta la compilación se
      # cae con un `TypeError` que no dice nada (#294 en la web, #493 y #498 en
      # Ontoy). Si alguien vuelve a importarlo, que se lea aquí con su nombre y
      # no como un rojo intermitente de red. No necesita dependencias.
      - name: Ninguna app baja su letra de internet
        run: node scripts/verificar-fuentes-locales.mjs

      # La raya de Ontoy 3.0 (docs/Ficha-Construccion-Ontoy-3-Pagos.md, §1): los
      # pagos se construyen para probar la mecánica, NO para cobrar, y no se
      # toca dinero real hasta que responda el abogado. Una regla que sólo vive
      # en un documento se rompe sin que nadie lo note; ésta se lee aquí, en el
      # PR que la rompió. Como la de las fuentes, no necesita dependencias.
      - name: Nada en el repo puede cobrar dinero real
        run: node scripts/verificar-sin-cobro.mjs

      - name: Compilar
        run: pnpm build

      # `next build` NO revisa los tipos de los archivos de prueba: no están en
      # el grafo de módulos de la app. Eso importa porque algunas leyes se hacen
      # cumplir con tipos y no con aserciones —lo filtrado por resultado no se
      # puede contar como periodo— y su prueba es un `@ts-expect-error`. Sin
      # este paso, esa valla no la vigila nadie.
      - name: Tipos, incluidas las pruebas
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Decir lo que NO se probó
        if: always()
        run: |
          echo "::notice::Las pruebas de integración de @jtel/db no corren en CI:"
          echo "::notice::escriben contra una rama de Neon y necesitan DATABASE_URL_TEST."
          echo "::notice::Se corren a mano con: pnpm --filter @jtel/db test:integration"
