name: Temporary ASR artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp-asr-trigger

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Spanish Vosk model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o vosk-model-small-es-0.42.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          echo "09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f  vosk-model-small-es-0.42.zip" | sha256sum --check

      - name: Upload temporary model artifact
        uses: actions/upload-artifact@v4
        with:
          name: vosk-model-small-es-0.42
          path: vosk-model-small-es-0.42.zip
          retention-days: 1
          if-no-files-found: error
