name: Temporary Faster Whisper model artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-asr-model-20260715.yml

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Faster Whisper base model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-base',
              local_dir='faster-whisper-base',
              ignore_patterns=['*.md', '.gitattributes'],
          )
          PY
          find faster-whisper-base -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Upload temporary model artifact
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-base
          path: faster-whisper-base
          retention-days: 1
          if-no-files-found: error
